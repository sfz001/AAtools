<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'none'; font-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
  <title>AAtools Chat Input</title>
  <link rel="stylesheet" href="chat-frame.css">
</head>
<body>
  <form id="chat-form" autocomplete="off">
    <label class="sr-only" for="chat-input">输入你的问题</label>
    <textarea id="chat-input" maxlength="10000" rows="2" placeholder="输入你的问题…" required
      spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"></textarea>
    <button id="chat-send" type="submit">发送</button>
  </form>
  <div id="chat-status" role="status" aria-live="polite"></div>
  <script src="chat-frame.js"></script>
</body>
</html>
