name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        shell: bash
        run: |
          while IFS= read -r file; do
            node --check "$file"
          done < <(git ls-files '*.js')
      - name: Check manifest and patch hygiene
        run: |
          node -e "JSON.parse(require('node:fs').readFileSync('manifest.json', 'utf8'))"
          git diff --check
      - name: Run tests
        run: node --test tests/*.test.js
